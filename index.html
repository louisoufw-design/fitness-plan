<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>健身課筆記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 單欄儀表板。頂部數據列、分頁(紀錄/複習/新增)、卡片式課堂紀錄。深色為主,淺色為輔。 */
:root {
  --bg: #0e1319;
  --surface: #161d26;
  --surface2: #1f2832;
  --line: #2b3745;
  --fg: #eaf0f6;
  --muted: #8d9bad;
  --accent: #ffc53d;
  --accent-ink: #1a1300;
  --accent-text: #ffc53d;
  --good: #4cc38a;
  --warn: #ff7a59;
  --font-display: 'Barlow Condensed', 'Noto Sans TC', sans-serif;
  --font-body: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1f5; --surface: #ffffff; --surface2: #e7ecf2; --line: #d2dae4;
    --fg: #121a24; --muted: #5a6a7c; --accent: #f2b200; --accent-ink: #1a1300;
    --accent-text: #8a5f00; --good: #1f8f5c; --warn: #cf4a25;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef1f5; --surface: #ffffff; --surface2: #e7ecf2; --line: #d2dae4;
  --fg: #121a24; --muted: #5a6a7c; --accent: #f2b200; --accent-ink: #1a1300;
  --accent-text: #8a5f00; --good: #1f8f5c; --warn: #cf4a25;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.app {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.eyebrow { font-family: var(--font-display); font-weight: 600; letter-spacing: .14em; font-size: 13px; color: var(--accent-text); text-transform: uppercase; }
h1 { font-size: 30px; line-height: 1.2; margin: 2px 0 2px; font-weight: 700; text-wrap: balance; }
.today { color: var(--muted); font-size: 13px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 10px; min-width: 0; }
.tile .num { font-family: var(--font-display); font-weight: 700; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .num small { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.tile .lbl { font-size: 12px; color: var(--muted); margin-top: 6px; }
.tile.hot .num { color: var(--accent-text); }

.insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin-top: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.panel h2 { font-size: 12px; font-weight: 500; color: var(--muted); margin: 0 0 8px; letter-spacing: .04em; }
.spark { width: 100%; height: auto; display: block; }
.spark .grid { stroke: var(--line); stroke-width: 1; }
.spark .ln { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.spark .ar { fill: var(--accent); fill-opacity: .14; stroke: none; }
.spark .dot { fill: var(--accent); }
.spark text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.spark text.end { fill: var(--fg); font-family: var(--font-display); font-size: 13px; font-weight: 600; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 4.5em 1fr 2em; align-items: center; gap: 8px; font-size: 13px; }
.bar .track { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 4px; }
.bar .n { font-family: var(--font-display); font-weight: 600; font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }

nav.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); display: flex; gap: 4px; margin-top: 18px; padding-block: 8px;
  border-bottom: 1px solid var(--line);
}
.tab { flex: 1; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 9px 4px; font-weight: 500; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.tab:not([aria-selected="true"]):hover { background: var(--surface); color: var(--fg); }

section.view { margin-top: 16px; display: grid; gap: 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 12px; min-width: 0; }
.card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.date { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.wd { color: var(--muted); font-size: 12px; }
.ttl { font-weight: 700; flex: 1; min-width: 8em; overflow-wrap: anywhere; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface2); white-space: nowrap; }
.pill.l1, .pill.l2 { color: var(--good); border-color: var(--good); }
.pill.l4, .pill.l5 { color: var(--warn); border-color: var(--warn); }
.sec-lbl { font-size: 12px; color: var(--muted); letter-spacing: .06em; margin: 12px 0 4px; }
ul.cues { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.cues li { background: var(--surface2); border-radius: 6px; padding: 7px 10px; overflow-wrap: anywhere; }
.feel { color: var(--fg); overflow-wrap: anywhere; }
.feel .areas { color: var(--accent-text); font-weight: 500; }
.feel .note { color: var(--muted); display: block; }
.card-foot { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
.link { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.link:hover { color: var(--fg); border-color: var(--muted); }
.link.danger.armed { color: var(--warn); border-color: var(--warn); }

.todo { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; cursor: pointer; }
.todo input { appearance: none; -webkit-appearance: none; flex: none; width: 20px; height: 20px; margin: 2px 0 0; border: 2px solid var(--muted); border-radius: 5px; background: transparent; cursor: pointer; display: grid; place-content: center; }
.todo input:checked { background: var(--accent); border-color: var(--accent); }
.todo input:checked::after { content: ""; width: 5px; height: 10px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
.todo span { overflow-wrap: anywhere; }
.todo input:checked + span { color: var(--muted); text-decoration: line-through; }

.flash { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px 18px 16px; text-align: left; }
.flash .big { font-size: 24px; line-height: 1.5; font-weight: 700; min-height: 4.5em; overflow-wrap: anywhere; text-wrap: balance; }
.flash .src { color: var(--muted); font-size: 13px; margin-top: 10px; }
.flash .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.flash .cnt { font-family: var(--font-display); font-weight: 600; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 6px 0; }

form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .flabel { font-size: 13px; color: var(--muted); font-weight: 500; }
.hint { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="date"], input[type="password"], textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0;
}
textarea { resize: vertical; min-height: 96px; line-height: 1.6; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; }
.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.seg button { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 2px; display: grid; gap: 0; justify-items: center; line-height: 1.3; }
.seg .v { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.1; }
.seg .t { font-size: 11px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg button[aria-pressed="true"] .t { color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 5px 13px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.form-actions { display: flex; gap: 8px; }
.form-actions .btn { flex: 1; }

.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 26px 18px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 17px; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; }
.banner { background: var(--surface2); border: 1px solid var(--warn); color: var(--fg); border-radius: 8px; padding: 10px 12px; margin-top: 14px; font-size: 14px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px);
}
@media (prefers-reduced-motion: no-preference) {
  .bar .fill { transition: width .4s ease; }
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
.topbar #who { overflow-wrap: anywhere; }
.authbox { margin-top: 18px; }
.authbox .card { padding: 18px 16px; }
.autherr { color: var(--warn); font-size: 13px; overflow-wrap: anywhere; }
.linkbtn { background: none; border: 0; color: var(--accent-text); padding: 6px 0; text-align: left; text-decoration: underline; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>

<div class="app">
  <div class="topbar" id="topbar" hidden><span id="who"></span><button class="link" id="logout" type="button">登出</button></div>
  <div class="eyebrow">Training Log</div>
  <h1>健身課筆記</h1>
  <div class="today" id="today"></div>

  <div class="banner" id="banner" hidden></div>

  <section class="authbox" id="auth" hidden>
    <div class="card">
      <div class="eyebrow" id="auth-title">登入</div>
      <form id="auth-form" autocomplete="on" style="margin-top:12px">
        <div class="field">
          <label for="a-name">帳號</label>
          <input type="text" id="a-name" autocomplete="username" maxlength="60" required>
          <div class="hint">自己取一個名字就好,中文也可以</div>
        </div>
        <div class="field">
          <label for="a-pass">密碼</label>
          <input type="password" id="a-pass" autocomplete="current-password" required>
          <div class="hint" id="a-hint"></div>
        </div>
        <div class="autherr" id="a-err" hidden></div>
        <div class="form-actions"><button type="submit" class="btn" id="a-submit">登入</button></div>
        <button type="button" class="linkbtn" id="a-switch">還沒有帳號?註冊</button>
      </form>
      <div class="hint" style="margin-top:10px">忘記密碼目前無法自己重設,請聯絡這個網站的管理員。</div>
    </div>
  </section>

  <div id="main" hidden>
  <div class="stats">
    <div class="tile"><div class="num" id="st-total">0<small>堂</small></div><div class="lbl">累計上課</div></div>
    <div class="tile"><div class="num" id="st-month">0<small>堂</small></div><div class="lbl">本月</div></div>
    <div class="tile hot"><div class="num" id="st-open">0<small>項</small></div><div class="lbl">待加強</div></div>
  </div>
  <div class="insights" id="insights" hidden></div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="log" id="tab-log" aria-selected="true">紀錄</button>
    <button class="tab" role="tab" data-tab="review" id="tab-review" aria-selected="false">複習</button>
    <button class="tab" role="tab" data-tab="add" id="tab-add" aria-selected="false">＋ 新增</button>
  </nav>

  <section class="view" id="view-log"></section>
  <section class="view" id="view-review" hidden></section>
  <section class="view" id="view-add" hidden>
    <form id="form" autocomplete="off">
      <div class="eyebrow" id="form-mode">新的一堂</div>
      <div class="field">
        <label for="f-date">上課日期</label>
        <input type="date" id="f-date" required>
      </div>
      <div class="field">
        <label for="f-title">這堂練什麼</label>
        <input type="text" id="f-title" placeholder="例:下肢力量、核心穩定、全身循環" maxlength="60">
      </div>
      <div class="field">
        <label for="f-cues">教練的口訣與提醒</label>
        <textarea id="f-cues" placeholder="一行寫一句,之後複習會一句一句抽出來&#10;例:吐氣的時候肋骨往下收&#10;例:膝蓋跟著腳尖的方向"></textarea>
      </div>
      <div class="field">
        <div class="flabel" id="fl-fatigue">今天練完的疲勞度</div>
        <div class="seg" id="f-fatigue" role="group" aria-labelledby="fl-fatigue"></div>
      </div>
      <div class="field">
        <div class="flabel" id="fl-areas">哪裡有感覺(可複選)</div>
        <div class="chips" id="f-areas" role="group" aria-labelledby="fl-areas"></div>
      </div>
      <div class="field">
        <label for="f-note">身體狀態備註</label>
        <textarea id="f-note" style="min-height:64px" placeholder="例:右肩比較緊、睡眠不太夠、狀態很好"></textarea>
      </div>
      <div class="field">
        <label for="f-focus">下次要加強的重點</label>
        <textarea id="f-focus" placeholder="一行一項,會變成可以勾選的待辦&#10;例:深蹲下去時腳跟不要離地"></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn ghost" id="f-cancel" hidden>取消編輯</button>
        <button type="submit" class="btn" id="f-save">儲存這堂課</button>
      </div>
    </form>
  </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, props) {
    var n = document.createElement(tag);
    if (props) for (var k in props) {
      var v = props[k];
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++) {
        var c = kids[j];
        if (c == null || c === false) continue;
        n.append(c.nodeType ? c : document.createTextNode(c));
      }
    }
    return n;
  }

  var WD = ['日', '一', '二', '三', '四', '五', '六'];
  var FATIGUE = ['輕鬆', '還行', '有感', '很累', '爆掉'];
  var AREAS = ['肩膀', '手臂', '胸', '背', '核心', '腰', '臀', '大腿前', '大腿後', '小腿', '膝蓋', '手腕'];

  function pad(n) { return String(n).padStart(2, '0'); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseDate(s) { var p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function fmt(s) { var d = parseDate(s); return { md: pad(d.getMonth() + 1) + '/' + pad(d.getDate()), wd: d.getFullYear() + ' 週' + WD[d.getDay()] }; }

  var sb = null, user = null, loaded = false, failed = false, slow = false;
  var sessions = [];
  var tab = 'log', pickedTab = false;
  var editingId = null, fatigue = 3, areaSel = new Set();
  var armedDelete = null, armTimer = null;
  var chain = {};
  var deck = [], deckPos = 0, deckSize = -1;

  $('today').textContent = (function () { var d = new Date(); return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 週' + WD[d.getDay()]; })();

  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }

  function normalize(d) {
    return {
      id: d.id, date: d.date || todayStr(), title: d.title || '',
      cues: Array.isArray(d.cues) ? d.cues : [],
      fatigue: typeof d.fatigue === 'number' ? d.fatigue : 3,
      areas: Array.isArray(d.areas) ? d.areas : [],
      note: d.note || '',
      focus: Array.isArray(d.focus) ? d.focus.map(function (f) { return { text: String(f.text || ''), done: !!f.done }; }) : [],
      createdAt: d.createdAt || 0
    };
  }

  /* ---------- form widgets ---------- */
  function buildFormWidgets() {
    var seg = $('f-fatigue'); seg.textContent = '';
    FATIGUE.forEach(function (t, i) {
      var v = i + 1;
      seg.append(el('button', { type: 'button', 'data-v': v, 'aria-pressed': String(v === fatigue), onclick: function () { fatigue = v; syncSeg(); } },
        el('span', { class: 'v', text: String(v) }), el('span', { class: 't', text: t })));
    });
    var chips = $('f-areas'); chips.textContent = '';
    AREAS.forEach(function (a) {
      chips.append(el('button', { type: 'button', class: 'chip', 'data-a': a, 'aria-pressed': String(areaSel.has(a)), text: a, onclick: function () {
        if (areaSel.has(a)) areaSel.delete(a); else areaSel.add(a); syncChips();
      } }));
    });
  }
  function syncSeg() { [].forEach.call($('f-fatigue').children, function (b) { b.setAttribute('aria-pressed', String(Number(b.getAttribute('data-v')) === fatigue)); }); }
  function syncChips() { [].forEach.call($('f-areas').children, function (b) { b.setAttribute('aria-pressed', String(areaSel.has(b.getAttribute('data-a')))); }); }

  function resetForm() {
    editingId = null; fatigue = 3; areaSel = new Set();
    $('f-date').value = todayStr(); $('f-title').value = ''; $('f-cues').value = '';
    $('f-note').value = ''; $('f-focus').value = '';
    $('form-mode').textContent = '新的一堂'; $('f-save').textContent = '儲存這堂課'; $('f-cancel').hidden = true;
    syncSeg(); syncChips();
  }
  function startEdit(s) {
    editingId = s.id; fatigue = s.fatigue; areaSel = new Set(s.areas);
    $('f-date').value = s.date; $('f-title').value = s.title; $('f-cues').value = s.cues.join('\n');
    $('f-note').value = s.note; $('f-focus').value = s.focus.map(function (f) { return f.text; }).join('\n');
    $('form-mode').textContent = '編輯 ' + fmt(s.date).md + ' 這堂'; $('f-save').textContent = '更新這堂課'; $('f-cancel').hidden = false;
    syncSeg(); syncChips(); setTab('add'); pickedTab = true;
  }
  function lines(v) {
    return v.split('\n').map(function (l) { return l.replace(/^\s*[-•*・]\s*/, '').trim(); }).filter(Boolean);
  }

  $('f-cancel').addEventListener('click', function () { resetForm(); setTab('log'); });
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!user) { toast('請先登入'); return; }
    var old = editingId ? sessions.filter(function (s) { return s.id === editingId; })[0] : null;
    var focusTexts = lines($('f-focus').value);
    var focus = focusTexts.map(function (t) {
      var prev = old ? old.focus.filter(function (f) { return f.text === t; })[0] : null;
      return { text: t, done: prev ? prev.done : false };
    });
    var data = {
      date: $('f-date').value || todayStr(), title: $('f-title').value.trim(),
      cues: lines($('f-cues').value), fatigue: fatigue,
      areas: AREAS.filter(function (a) { return areaSel.has(a); }),
      note: $('f-note').value.trim(), focus: focus,
      createdAt: old ? old.createdAt : Date.now(), updatedAt: Date.now()
    };
    if (!data.title && !data.cues.length && !data.focus.length && !data.note) { toast('至少寫一點內容再儲存'); return; }
    var btn = $('f-save'); btn.disabled = true;
    var p = saveSession(editingId, data);
    p.then(function () {
      toast(editingId ? '已更新' : '已儲存');
      resetForm(); setTab('log'); pickedTab = true; window.scrollTo(0, 0);
    }).catch(function () { toast('沒有儲存成功,請再按一次'); })
      .then(function () { btn.disabled = false; });
  });

  /* ---------- tabs ---------- */
  function setTab(t) {
    tab = t;
    ['log', 'review', 'add'].forEach(function (k) {
      $('view-' + k).hidden = k !== t;
      $('tab-' + k).setAttribute('aria-selected', String(k === t));
    });
  }
  [].forEach.call(document.querySelectorAll('.tab'), function (b) {
    b.addEventListener('click', function () { pickedTab = true; setTab(b.getAttribute('data-tab')); });
  });

  /* ---------- actions ---------- */
  function toggleFocus(id, idx) {
    var run = function () {
      var s = sessions.filter(function (x) { return x.id === id; })[0];
      if (!s || !s.focus[idx]) return Promise.resolve();
      var focus = s.focus.map(function (f, i) { return i === idx ? { text: f.text, done: !f.done } : f; });
      return sb.from('fitness_sessions').update({ focus: focus }).eq('id', id).then(function (res) {
        if (res.error) { render(); throw res.error; }
        s.focus = focus; render();
      });
    };
    chain[id] = (chain[id] || Promise.resolve()).then(run).catch(function () { toast('沒有儲存成功,請再試一次'); });
  }
  function del(id) {
    if (armedDelete !== id) {
      armedDelete = id; clearTimeout(armTimer);
      armTimer = setTimeout(function () { armedDelete = null; render(); }, 4000);
      render(); return;
    }
    armedDelete = null; clearTimeout(armTimer);
    sb.from('fitness_sessions').delete().eq('id', id).then(function (res) {
      if (res.error) throw res.error;
      sessions = sessions.filter(function (x) { return x.id !== id; });
      toast('已刪除'); render();
    }).catch(function () { toast('刪除失敗,請再試一次'); render(); });
    render();
  }

  /* ---------- render ---------- */
  function todo(s, i) {
    var f = s.focus[i];
    var cb = el('input', { type: 'checkbox', onchange: function () { toggleFocus(s.id, i); } });
    cb.checked = f.done;
    return el('label', { class: 'todo' }, cb, el('span', { text: f.text }));
  }

  function renderStats() {
    var ym = todayStr().slice(0, 7);
    var open = 0;
    sessions.forEach(function (s) { s.focus.forEach(function (f) { if (!f.done) open++; }); });
    var set = function (id, n, u) { var e = $(id); e.textContent = String(n); e.append(el('small', { text: u })); };
    set('st-total', sessions.length, '堂');
    set('st-month', sessions.filter(function (s) { return s.date.slice(0, 7) === ym; }).length, '堂');
    set('st-open', open, '項');
  }

  function sparkline() {
    var pts = sessions.slice(0, 10).reverse();
    var W = 300, H = 92, L = 40, R = 14, T = 12, B = 14;
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('class', 'spark');
    svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', '最近 ' + pts.length + ' 堂的疲勞度');
    var y = function (v) { return T + (5 - v) / 4 * (H - T - B); };
    var x = function (i) { return pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1); };
    function add(tag, attrs, text) {
      var n = document.createElementNS(ns, tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (text != null) n.textContent = text;
      svg.append(n); return n;
    }
    [1, 3, 5].forEach(function (v) {
      add('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), class: 'grid' });
      add('text', { x: L - 6, y: y(v) + 3, 'text-anchor': 'end' }, FATIGUE[v - 1]);
    });
    var coords = pts.map(function (s, i) { return [x(i), y(s.fatigue)]; });
    if (coords.length > 1) {
      var d = coords.map(function (c, i) { return (i ? 'L' : 'M') + c[0].toFixed(1) + ' ' + c[1].toFixed(1); }).join(' ');
      add('path', { d: d + ' L' + coords[coords.length - 1][0] + ' ' + y(1) + ' L' + coords[0][0] + ' ' + y(1) + ' Z', class: 'ar' });
      add('path', { d: d, class: 'ln' });
    }
    var last = coords[coords.length - 1];
    add('circle', { cx: last[0], cy: last[1], r: 4.5, class: 'dot' });
    return svg;
  }

  function renderInsights() {
    var box = $('insights');
    if (!sessions.length) { box.hidden = true; return; }
    box.hidden = false; box.textContent = '';
    box.append(el('div', { class: 'panel' }, el('h2', { text: '疲勞度(最近 ' + Math.min(10, sessions.length) + ' 堂)' }), sparkline()));
    var cnt = {};
    sessions.forEach(function (s) { s.areas.forEach(function (a) { cnt[a] = (cnt[a] || 0) + 1; }); });
    var top = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; }).slice(0, 4);
    if (top.length) {
      var max = cnt[top[0]];
      box.append(el('div', { class: 'panel' }, el('h2', { text: '最常有感覺的部位' }),
        el('div', { class: 'bars' }, top.map(function (a) {
          return el('div', { class: 'bar' }, el('span', { text: a }),
            el('div', { class: 'track' }, el('div', { class: 'fill', style: 'width:' + Math.round(cnt[a] / max * 100) + '%' })),
            el('span', { class: 'n', text: String(cnt[a]) }));
        }))));
    }
  }

  function emptyBlock(title, sub) {
    return el('div', { class: 'empty' }, el('strong', { text: title }), sub,
      el('div', null, el('button', { class: 'btn', type: 'button', text: '記錄第一堂課', onclick: function () { pickedTab = true; setTab('add'); } })));
  }

  function renderLog() {
    var v = $('view-log'); v.textContent = '';
    if (!loaded && !failed) { v.append(el('div', { class: 'empty', text: slow ? '還連不到資料,稍後再看一次。' : '讀取紀錄中…' })); return; }
    if (failed) { v.append(el('div', { class: 'empty', text: '讀取失敗,請重新開啟這個頁面。' })); return; }
    if (!sessions.length) { v.append(emptyBlock('還沒有任何一堂課', '上完課後,把口訣、身體感受和下次重點記在這裡。')); return; }
    sessions.forEach(function (s) {
      var f = fmt(s.date);
      var card = el('article', { class: 'card' },
        el('div', { class: 'card-head' },
          el('div', null, el('div', { class: 'date', text: f.md }), el('div', { class: 'wd', text: f.wd })),
          el('div', { class: 'ttl', text: s.title || '未命名的一堂' }),
          el('span', { class: 'pill l' + s.fatigue, text: '疲勞 ' + s.fatigue + '・' + FATIGUE[s.fatigue - 1] })));
      if (s.cues.length) {
        card.append(el('div', { class: 'sec-lbl', text: '教練口訣' }),
          el('ul', { class: 'cues' }, s.cues.map(function (c) { return el('li', { text: c }); })));
      }
      if (s.areas.length || s.note) {
        card.append(el('div', { class: 'sec-lbl', text: '身體感受' }),
          el('div', { class: 'feel' }, s.areas.length && el('span', { class: 'areas', text: s.areas.join('、') }), s.note && el('span', { class: 'note', text: s.note })));
      }
      if (s.focus.length) {
        card.append(el('div', { class: 'sec-lbl', text: '下次要加強' }), s.focus.map(function (_, i) { return todo(s, i); }));
      }
      card.append(el('div', { class: 'card-foot' },
        el('button', { class: 'link', type: 'button', text: '編輯', onclick: function () { startEdit(s); window.scrollTo(0, 0); } }),
        el('button', { class: 'link danger' + (armedDelete === s.id ? ' armed' : ''), type: 'button', text: armedDelete === s.id ? '再按一次刪除' : '刪除', onclick: function () { del(s.id); } })));
      v.append(card);
    });
  }

  function shuffle(n) {
    var a = []; for (var i = 0; i < n; i++) a.push(i);
    for (var j = n - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; }
    return a;
  }

  function renderReview() {
    var v = $('view-review'); v.textContent = '';
    if (!loaded || !sessions.length) {
      v.append(loaded ? emptyBlock('還沒有可以複習的內容', '先記錄一堂課,這裡會把口訣做成卡片、把待加強整理成清單。') : el('div', { class: 'empty', text: '讀取紀錄中…' }));
      return;
    }
    var pool = [];
    sessions.forEach(function (s) { s.cues.forEach(function (c) { pool.push({ text: c, date: s.date, title: s.title }); }); });
    if (pool.length !== deckSize) { deckSize = pool.length; deck = shuffle(pool.length); deckPos = 0; }
    if (pool.length) {
      var item = pool[deck[deckPos % pool.length]];
      var f = fmt(item.date);
      v.append(el('div', { class: 'flash' },
        el('div', { class: 'eyebrow', text: '口訣抽卡' }),
        el('div', { class: 'big', text: item.text }),
        el('div', { class: 'src', text: f.md + (item.title ? '・' + item.title : '') }),
        el('div', { class: 'row' },
          el('span', { class: 'cnt', text: (deckPos % pool.length + 1) + ' / ' + pool.length }),
          el('button', { class: 'btn', type: 'button', text: '下一句', onclick: function () {
            deckPos++; if (deckPos >= pool.length) { deck = shuffle(pool.length); deckPos = 0; } renderReview();
          } }))));
    }
    var open = sessions.filter(function (s) { return s.focus.some(function (x) { return !x.done; }); });
    var doneItems = sessions.filter(function (s) { return s.focus.some(function (x) { return x.done; }); });
    var card = el('div', { class: 'card' }, el('div', { class: 'eyebrow', text: '待加強清單' }));
    if (!open.length) card.append(el('div', { class: 'hint', style: 'margin-top:8px', text: '目前沒有未完成的重點。' }));
    open.forEach(function (s) {
      var f = fmt(s.date);
      card.append(el('div', { class: 'sec-lbl', text: f.md + (s.title ? '・' + s.title : '') }),
        s.focus.map(function (x, i) { return x.done ? null : todo(s, i); }));
    });
    if (doneItems.length) {
      var n = 0; doneItems.forEach(function (s) { s.focus.forEach(function (x) { if (x.done) n++; }); });
      card.append(el('details', null, el('summary', { text: '已完成 ' + n + ' 項' }),
        doneItems.map(function (s) { return s.focus.map(function (x, i) { return x.done ? todo(s, i) : null; }); })));
    }
    v.append(card);
  }

  function render() {
    renderStats(); renderInsights(); renderLog();
    if (!$('view-review').hidden) renderReview();
  }
  var origSetTab = setTab;
  setTab = function (t) { origSetTab(t); if (t === 'review') renderReview(); };

  /* ---------- init ---------- */
  buildFormWidgets(); resetForm(); render();

  /* ---------- Supabase ---------- */
  var SUPABASE_URL = 'https://vuufcvirtchxizknnjhe.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1dWZjdmlydGNoeGl6a25uamhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzNzYzMDQsImV4cCI6MjEwOTk1MjMwNH0.-2lGVO7LRUap5y8EPPUq8fqs8P-ceELy4xXijji-3jo';
  var FAKE_DOMAIN = 'myapp.local'; /* 帳號不是 email 時,轉成這個假 email;輸入真 email 則照原樣使用 */
  var authMode = 'login', slowTimer = null;

  function rowToSession(r) {
    return normalize({ id: r.id, date: r.session_date, title: r.title, cues: r.cues, fatigue: r.fatigue,
      areas: r.areas, note: r.note, focus: r.focus, createdAt: Date.parse(r.created_at) || 0 });
  }

  function fetchSessions() {
    return sb.from('fitness_sessions').select('*')
      .order('session_date', { ascending: false }).order('created_at', { ascending: false })
      .then(function (res) {
        if (res.error) throw res.error;
        sessions = res.data.map(rowToSession);
        loaded = true; failed = false; slow = false; clearTimeout(slowTimer);
        if (!pickedTab) setTab(sessions.length ? 'log' : 'add');
        render();
      }).catch(function () { clearTimeout(slowTimer); failed = true; render(); });
  }

  function saveSession(id, d) {
    var row = { session_date: d.date, title: d.title, cues: d.cues, fatigue: d.fatigue, areas: d.areas, note: d.note, focus: d.focus };
    var q = id ? sb.from('fitness_sessions').update(row).eq('id', id) : sb.from('fitness_sessions').insert(row);
    return q.then(function (res) {
      if (res.error) throw res.error;
      return fetchSessions();
    });
  }

  /* ---------- auth ---------- */
  function nameToEmail(name) {
    var n = name.trim();
    if (n.indexOf('@') > 0) return Promise.resolve(n.toLowerCase());
    var bytes = new TextEncoder().encode(n.normalize('NFKC').toLowerCase());
    return crypto.subtle.digest('SHA-256', bytes).then(function (buf) {
      var hex = Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      return 'u' + hex.slice(0, 40) + '@' + FAKE_DOMAIN;
    });
  }

  function authError(msg) { var e = $('a-err'); e.textContent = msg || ''; e.hidden = !msg; }

  function friendly(err) {
    var m = String((err && err.message) || '').toLowerCase();
    if (m.indexOf('invalid login') >= 0) return '帳號或密碼不對。';
    if (m.indexOf('already registered') >= 0 || m.indexOf('already been registered') >= 0) return '這個帳號已經有人用了,換一個名字,或直接登入。';
    if (m.indexOf('password') >= 0) return '密碼太短或太弱,請至少用 6 個字。';
    if (m.indexOf('not confirmed') >= 0) return '這個帳號還沒完成信箱驗證。';
    if (m.indexOf('rate limit') >= 0 || m.indexOf('too many') >= 0) return '嘗試太多次了,請等一下再試。';
    if (m.indexOf('email') >= 0 && m.indexOf('invalid') >= 0) return '系統不接受這個帳號格式,請改用真實的 Email 當帳號。';
    if (m.indexOf('fetch') >= 0 || m.indexOf('network') >= 0) return '連不上伺服器,請檢查網路。';
    return '失敗了:' + ((err && err.message) || '未知錯誤');
  }

  function setAuthMode(m) {
    authMode = m;
    $('auth-title').textContent = m === 'login' ? '登入' : '註冊新帳號';
    $('a-submit').textContent = m === 'login' ? '登入' : '註冊';
    $('a-switch').textContent = m === 'login' ? '還沒有帳號?註冊' : '已經有帳號?登入';
    $('a-pass').setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
    $('a-hint').textContent = m === 'login' ? '' : '至少 6 個字';
    authError('');
  }

  function onSignedIn(u) {
    user = u;
    $('auth').hidden = true; $('main').hidden = false; $('topbar').hidden = false;
    $('who').textContent = (u.user_metadata && u.user_metadata.display_name) || u.email || '';
    showBanner('');
    sessions = []; loaded = false; failed = false; slow = false; pickedTab = false;
    clearTimeout(slowTimer); slowTimer = setTimeout(function () { slow = true; render(); }, 10000);
    resetForm(); render(); fetchSessions();
  }

  function onSignedOut() {
    user = null; sessions = []; loaded = false; failed = false;
    clearTimeout(slowTimer);
    $('main').hidden = true; $('topbar').hidden = true; $('auth').hidden = false;
    resetForm(); setTab('log'); pickedTab = false;
  }

  function showBanner(msg) { $('banner').hidden = !msg; $('banner').textContent = msg || ''; }

  $('a-switch').addEventListener('click', function () { setAuthMode(authMode === 'login' ? 'register' : 'login'); });
  $('logout').addEventListener('click', function () { if (sb) sb.auth.signOut(); });
  $('auth-form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!sb) return;
    var name = $('a-name').value.trim(), pass = $('a-pass').value;
    if (!name || !pass) return;
    if (authMode === 'register' && pass.length < 6) { authError('密碼至少 6 個字。'); return; }
    var btn = $('a-submit'); btn.disabled = true; authError('');
    nameToEmail(name).then(function (email) {
      if (authMode === 'login') return sb.auth.signInWithPassword({ email: email, password: pass });
      return sb.auth.signUp({ email: email, password: pass, options: { data: { display_name: name } } });
    }).then(function (res) {
      if (res.error) throw res.error;
      $('a-pass').value = '';
      if (authMode === 'register' && !res.data.session) authError('註冊完成,但需要先到信箱點驗證連結才能登入。');
    }).catch(function (err) { authError(friendly(err)); })
      .then(function () { btn.disabled = false; });
  });

  /* ---------- init ---------- */
  setAuthMode('login');
  if (!window.supabase || !window.supabase.createClient) {
    $('auth').hidden = false;
    showBanner('登入功能載入失敗,請檢查網路後重新整理。');
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange(function (event, session) {
    setTimeout(function () {
      if (session && session.user) { if (!user || user.id !== session.user.id) onSignedIn(session.user); }
      else onSignedOut();
    }, 0);
  });
})();
</script>

</body></html>
